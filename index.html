    <script>
      // Suppress Vite HMR WebSocket connection attempts in the AI Studio cloud proxy
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('/@vite/') || url.includes('vite') || url.includes('ws://') || url.includes('wss://'))) {
              // Return a silent mock WebSocket that starts in CLOSED state
              const mockWS = {
                url: url,
                readyState: 3, // CLOSED state
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              return mockWS;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          for (let prop in OriginalWebSocket) {
            if (OriginalWebSocket.hasOwnProperty(prop)) {
              window.WebSocket[prop] = OriginalWebSocket[prop];
            }
          }
        }
      })();
    </script>
